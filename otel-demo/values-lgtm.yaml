# ============================================================================
# OpenTelemetry Demo - LGTM Stack Konfiguration
# Für Test mit Loki, Grafana, Tempo, Prometheus
# ============================================================================

# Default-Einstellungen für alle Services mit LGTM-spezifischen Endpunkten
default:
  env:
    # OTLP Exporter Endpoints für LGTM Stack
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://tempo.observability-lgtm.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    
    # Metrics-spezifische Konfiguration
    - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
      value: "http://prometheus-server.observability-lgtm.svc.cluster.local:80"
    - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
      value: "http"
    
    # Logs-Konfiguration
    - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
      value: "http://loki-gateway.observability-lgtm.svc.cluster.local/otlp"
    - name: OTEL_EXPORTER_OTLP_LOGS_PROTOCOL
      value: "http"
    
    # Traces-Konfiguration
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "http://tempo.observability-lgtm.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      value: "grpc"
    
    # Service-spezifische Labels
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: OTEL_K8S_POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.namespace=$(OTEL_K8S_NAMESPACE),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.pod.name=$(OTEL_K8S_POD_NAME),deployment.environment=test,stack=lgtm

# OpenTelemetry Collector Konfiguration
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      
      # Resource Processor für zusätzliche Attribute
      resource:
        attributes:
          - key: deployment.environment
            value: test
            action: upsert
          - key: observability.stack
            value: lgtm
            action: upsert
    
    exporters:
      # Tempo für Traces
      otlp/tempo:
        endpoint: tempo.observability-lgtm.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # Prometheus für Metrics (Remote Write)
      prometheusremotewrite/prometheus:
        endpoint: http://prometheus-server.observability-lgtm.svc.cluster.local:80/api/v1/write
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # Loki für Logs (OTLP HTTP with custom path)
      otlphttp/loki:
        endpoint: http://loki-gateway.observability-lgtm.svc.cluster.local/otlp
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # Debug exporter for troubleshooting
      debug:
        verbosity: normal
      
      # Logging für Debugging (optional, nur während Setup)
      # logging:
      #   loglevel: debug
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/tempo]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheusremotewrite/prometheus]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlphttp/loki, debug]
  
  # Collector Resources
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  
  # Collector Replicas für Hochverfügbarkeit
  replicaCount: 2
  
  # Ports
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

# Components Konfiguration
components:
  # Load Generator für Test-Phasen
  load-generator:
    enabled: true
    useDefault:
      env: true
    replicas: 1
    env:
      - name: LOCUST_WEB_HOST
        value: "0.0.0.0"
      - name: LOCUST_WEB_PORT
        value: "8089"
      - name: LOCUST_USERS
        value: "0"  # Startwert - wird während Test angepasst
      - name: LOCUST_SPAWN_RATE
        value: "5"
      - name: LOCUST_HOST
        value: "http://frontend-proxy:8080"
      - name: LOCUST_HEADLESS
        value: "false"
      - name: LOCUST_AUTOSTART
        value: "true"
      - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m

  # Alle anderen Services übernehmen die Default-Konfiguration
  frontend:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  accounting:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  ad:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  cart:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  checkout:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  currency:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  email:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  fraud-detection:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  payment:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  product-catalog:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  quote:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  recommendation:
    enabled: true
    useDefault:
      env: true
    replicas: 1
  
  shipping:
    enabled: true
    useDefault:
      env: true
    replicas: 1

  # Kafka für accounting, checkout, fraud-detection Services
  kafka:
    enabled: true
    useDefault:
      env: true
    replicas: 1

# Deaktiviere integrierte Observability (wird extern bereitgestellt)
jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false
