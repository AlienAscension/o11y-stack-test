# ============================================================================
# OpenTelemetry Demo - Korrigierte LGTM Stack Konfiguration
# ============================================================================

default:
  env:
    # Alle Apps senden an den INTERNEN Collector der Demo via gRPC
    # Das vermeidet HTTPS-Fehler und falsche Pfad-Anhänge in den Apps.
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://$(OTEL_COLLECTOR_NAME):4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"

    - name: OTEL_COLLECTOR_NAME
      value: "otel-collector"  # <-- Das fehlt!
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://$(OTEL_COLLECTOR_NAME):4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    
    # Da wir alles über den Collector (oben) senden, brauchen wir diese 
    # spezifischen Variablen hier nicht mehr manuell setzen.
    # Der Collector übernimmt das Routing zu Loki/Tempo/Prometheus.
    
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: OTEL_K8S_POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.namespace=$(OTEL_K8S_NAMESPACE),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.pod.name=$(OTEL_K8S_POD_NAME),deployment.environment=test,stack=lgtm

# OpenTelemetry Collector Konfiguration (Die Brücke zum LGTM-Stack)
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
      resource:
        attributes:
          - key: deployment.environment
            value: test
            action: upsert

    exporters:
      # Export zu Tempo (Traces)
      otlp/tempo:
        endpoint: "tempo.observability-lgtm.svc.cluster.local:4317"
        tls:
          insecure: true
      
      # Export zu Prometheus (Metrics via Remote Write)
      # Nutzt den Standard-Port 80 deines Prometheus-Service
      prometheusremotewrite/prometheus:
        endpoint: "http://prometheus-server.observability-lgtm.svc.cluster.local:80/api/v1/write"
        tls:
          insecure: true
      
      # Export zu Alloy (der dann zu Loki weiterleitet)
      # Alloy hat einen OTLP Receiver und konvertiert zu Loki
      otlp/alloy:
        endpoint: "alloy.observability-lgtm.svc.cluster.local:4317"
        tls:
          insecure: true
      
      debug:
        verbosity: normal
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite/prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/alloy, debug]

# Components Konfiguration
components:
  load-generator:
    enabled: true
    useDefault: { env: true }
  frontend:
    enabled: true
    useDefault: { env: true }
  accounting:
    enabled: true
    useDefault: { env: true }
  ad:
    enabled: true
    useDefault: { env: true }
  cart:
    enabled: true
    useDefault: { env: true }
  checkout:
    enabled: true
    useDefault: { env: true }
  currency:
    enabled: true
    useDefault: { env: true }
  email:
    enabled: true
    useDefault: { env: true }
  fraud-detection:
    enabled: true
    useDefault: { env: true }
  payment:
    enabled: true
    useDefault: { env: true }
  product-catalog:
    enabled: true
    useDefault: { env: true }
  quote:
