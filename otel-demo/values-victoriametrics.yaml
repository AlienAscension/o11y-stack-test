# ============================================================================
# OpenTelemetry Demo - VictoriaMetrics Stack Konfiguration
# Für Test mit VictoriaMetrics, VictoriaLogs, VictoriaTraces
# ============================================================================

# Default-Einstellungen für alle Services mit VictoriaMetrics-Stack-Endpunkten
default:
  env:
    # OTLP Exporter Endpoints für VictoriaMetrics Stack
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://victoriatraces.observability-vm.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    
    # Metrics-spezifische Konfiguration (VictoriaMetrics)
    - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
      value: "http://victoriametrics.observability-vm.svc.cluster.local:8428/opentelemetry"
    - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
      value: "http/protobuf"
    
    # Logs-Konfiguration (VictoriaLogs)
    - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
      value: "http://victorialogs.observability-vm.svc.cluster.local:9428/insert/opentelemetry"
    - name: OTEL_EXPORTER_OTLP_LOGS_PROTOCOL
      value: "http/protobuf"
    
    # Traces-Konfiguration (VictoriaTraces)
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "http://victoriatraces.observability-vm.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      value: "grpc"
    
    # Service-spezifische Labels
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: OTEL_K8S_POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.namespace=$(OTEL_K8S_NAMESPACE),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.pod.name=$(OTEL_K8S_POD_NAME),deployment.environment=test,stack=victoriametrics

  # Ressourcen (übernommen von Base)
  resources:
    limits:
      memory: 200Mi
      cpu: 200m
    requests:
      memory: 100Mi
      cpu: 100m

# OpenTelemetry Collector Konfiguration
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      
      # Resource Processor für zusätzliche Attribute
      resource:
        attributes:
          - key: deployment.environment
            value: test
            action: upsert
          - key: observability.stack
            value: victoriametrics
            action: upsert
      
      # Kubernetes Attributes Processor
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
    
    exporters:
      # VictoriaTraces für Traces (OTLP)
      otlp/victoriatraces:
        endpoint: victoriatraces.observability-vm.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        compression: gzip
      
      # VictoriaMetrics für Metrics (Prometheus Remote Write)
      prometheusremotewrite/victoriametrics:
        endpoint: http://victoriametrics.observability-vm.svc.cluster.local:8428/api/v1/write
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        resource_to_telemetry_conversion:
          enabled: true
        compression: gzip
        # VictoriaMetrics-spezifische Header
        headers:
          "X-Prometheus-Remote-Write-Version": "0.1.0"
      
      # Alternative: VictoriaMetrics OTLP Endpoint
      # otlphttp/victoriametrics:
      #   endpoint: http://victoriametrics.observability-vm.svc.cluster.local:8428/opentelemetry
      #   tls:
      #     insecure: true
      #   compression: gzip
      
      # VictoriaLogs für Logs (JSON-Line Format)
      # VictoriaLogs unterstützt verschiedene Ingestion-Formate
      # 1. OTLP HTTP
      otlphttp/victorialogs:
        endpoint: http://victorialogs.observability-vm.svc.cluster.local:9428/insert/opentelemetry
        tls:
          insecure: true
        compression: gzip
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 5
          queue_size: 500
      
      # 2. Alternative: Loki-Format (VictoriaLogs ist Loki-kompatibel)
      # loki/victorialogs:
      #   endpoint: http://victorialogs.observability-vm.svc.cluster.local:9428/insert/loki/api/v1/push
      #   tls:
      #     insecure: true
      
      # 3. Alternative: JSON-Line Format
      # http/victorialogs:
      #   endpoint: http://victorialogs.observability-vm.svc.cluster.local:9428/insert/jsonline
      #   tls:
      #     insecure: true
      #   encoding: json
      
      # Logging für Debugging (optional)
      # logging:
      #   loglevel: debug
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [otlp/victoriatraces]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [prometheusremotewrite/victoriametrics]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [otlphttp/victorialogs]
  
  # Collector Resources
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  
  # Collector Replicas
  replicaCount: 2
  
  # RBAC für Kubernetes Attributes Processor
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
          - namespaces
        verbs:
          - get
          - watch
          - list
      - apiGroups:
          - apps
        resources:
          - replicasets
          - deployments
        verbs:
          - get
          - list
          - watch
  
  serviceAccount:
    create: true
  
  # Ports
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

# ServiceMonitor für Meta-Monitoring durch kube-prom
serviceMonitor:
  enabled: true
  additionalLabels:
    prometheus: kube-prom
    release: kube-prom
    stack: victoriametrics

# Load Generator Konfiguration
components:
  loadGenerator:
    enabled: true
    replicas: 1
    env:
      - name: LOCUST_USERS
        value: "0"  # Startwert - wird während Test angepasst
      - name: LOCUST_SPAWN_RATE
        value: "5"
      - name: LOCUST_HOST
        value: "http://frontend:8080"
      - name: LOCUST_HEADLESS
        value: "true"
      - name: LOCUST_AUTOSTART
        value: "true"
      - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
    
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m

  # Alle anderen Services übernehmen die Default-Konfiguration
  frontend:
    enabled: true
    replicas: 1
  
  accountingService:
    enabled: true
    replicas: 1
  
  adService:
    enabled: true
    replicas: 1
  
  cartService:
    enabled: true
    replicas: 1
  
  checkoutService:
    enabled: true
    replicas: 1
  
  currencyService:
    enabled: true
    replicas: 1
  
  emailService:
    enabled: true
    replicas: 1
  
  frauddetectionService:
    enabled: true
    replicas: 1
  
  paymentService:
    enabled: true
    replicas: 1
  
  productCatalogService:
    enabled: true
    replicas: 1
  
  quoteService:
    enabled: true
    replicas: 1
  
  recommendationService:
    enabled: true
    replicas: 1
  
  shippingService:
    enabled: true
    replicas: 1

  # Kafka deaktiviert
  kafka:
    enabled: false

# Deaktiviere integrierte Observability (wird extern bereitgestellt)
jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false
