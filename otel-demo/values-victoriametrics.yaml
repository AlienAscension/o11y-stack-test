# ============================================================================
# OpenTelemetry Demo - VictoriaMetrics Stack Konfiguration
# Für Test mit VictoriaMetrics, VictoriaLogs, VictoriaTraces
# ============================================================================
#
# ACTUAL SERVICE ENDPOINTS (deployed in 'victoriametrics' namespace):
# - VictoriaMetrics: vmsingle-victoria-metrics-victoria-metrics-k8s-stack.victoriametrics.svc.cluster.local:8428
# - VictoriaLogs:    vlsingle-victorialogs.victoriametrics.svc.cluster.local:9428
# - VictoriaTraces:  vtsingle-victoriatraces.victoriametrics.svc.cluster.local:10428 (HTTP endpoint)
#
# ============================================================================

default:
  env:
    # Apps send to OTEL Collector via gRPC
    - name: OTEL_COLLECTOR_NAME
      value: "otel-collector"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://$(OTEL_COLLECTOR_NAME):4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    
    # Service-spezifische Labels
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: OTEL_K8S_POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.namespace=$(OTEL_K8S_NAMESPACE),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.pod.name=$(OTEL_K8S_POD_NAME),deployment.environment=test,stack=victoriametrics

# OpenTelemetry Collector Konfiguration
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      
      # Resource Processor für zusätzliche Attribute
      resource:
        attributes:
          - key: deployment.environment
            value: test
            action: upsert
          - key: observability.stack
            value: victoriametrics
            action: upsert
      
      # Kubernetes Attributes Processor
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
    
    exporters:
      # VictoriaTraces für Traces (OTLP HTTP)
      otlphttp/victoriatraces:
        endpoint: http://vtsingle-victoriatraces.victoriametrics.svc.cluster.local:10428/insert/opentelemetry
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        compression: gzip
      
      # VictoriaMetrics für Metrics (Prometheus Remote Write)
      prometheusremotewrite/victoriametrics:
        endpoint: http://vmsingle-victoria-metrics-victoria-metrics-k8s-stack.victoriametrics.svc.cluster.local:8428/api/v1/write
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        resource_to_telemetry_conversion:
          enabled: true
        compression: snappy
        headers:
          "X-Prometheus-Remote-Write-Version": "0.1.0"
      
      # VictoriaLogs für Logs (OTLP HTTP)
      otlphttp/victorialogs:
        endpoint: http://vlsingle-victorialogs.victoriametrics.svc.cluster.local:9428/insert/opentelemetry
        tls:
          insecure: true
        compression: gzip
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 5
          queue_size: 500
      
      debug:
        verbosity: normal
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [otlphttp/victoriatraces]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [prometheusremotewrite/victoriametrics]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [otlphttp/victorialogs, debug]
  
  # RBAC für Kubernetes Attributes Processor
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
          - namespaces
        verbs:
          - get
          - watch
          - list
      - apiGroups:
          - apps
        resources:
          - replicasets
          - deployments
        verbs:
          - get
          - list
          - watch
  
  serviceAccount:
    create: true

# Components Konfiguration
components:
  load-generator:
    enabled: true
    useDefault: { env: true }
  frontend:
    enabled: true
    useDefault: { env: true }
  accounting:
    enabled: true
    useDefault: { env: true }
  ad:
    enabled: true
    useDefault: { env: true }
  cart:
    enabled: true
    useDefault: { env: true }
  checkout:
    enabled: true
    useDefault: { env: true }
  currency:
    enabled: true
    useDefault: { env: true }
  email:
    enabled: true
    useDefault: { env: true }
  fraud-detection:
    enabled: true
    useDefault: { env: true }
  payment:
    enabled: true
    useDefault: { env: true }
  product-catalog:
    enabled: true
    useDefault: { env: true }
  quote:
