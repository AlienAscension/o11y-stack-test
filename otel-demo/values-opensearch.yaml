# ============================================================================
# OpenTelemetry Demo - OpenSearch Stack Konfiguration
# Für Test mit OpenSearch, Fluent Bit, Prometheus, Jaeger
# ============================================================================

# Default-Einstellungen für alle Services mit OpenSearch-Stack-Endpunkten
default:
  env:
    # Alle Apps senden an den INTERNEN Collector der Demo via gRPC
    - name: OTEL_COLLECTOR_NAME
      value: "otel-collector"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://$(OTEL_COLLECTOR_NAME):4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    
    # Service-spezifische Labels
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: OTEL_K8S_POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.namespace=$(OTEL_K8S_NAMESPACE),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),k8s.pod.name=$(OTEL_K8S_POD_NAME),deployment.environment=test,stack=opensearch

# OpenTelemetry Collector Konfiguration
opentelemetry-collector:
  enabled: true
  mode: deployment
  
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    extensions:
      # Health check extension (required)
      health_check:
        endpoint: 0.0.0.0:13133
      
      # BasicAuth extension for OpenSearch authentication
      basicauth/opensearch:
        client_auth:
          username: admin
          password: 1ihL2fm6aFo2S1dxuDRzfD
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      
      # Resource Processor für zusätzliche Attribute
      resource:
        attributes:
          - key: deployment.environment
            value: test
            action: upsert
          - key: observability.stack
            value: opensearch
            action: upsert
      
      # Kubernetes Attributes Processor
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
    
    exporters:
      # Jaeger für Traces
      otlp/jaeger:
        endpoint: jaeger-collector.observability-opensearch.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # Alternative: Jaeger gRPC Format
      # jaeger:
      #   endpoint: jaeger-collector.observability-opensearch.svc.cluster.local:14250
      #   tls:
      #     insecure: true
      
      # Prometheus Remote Write für Metrics
      prometheusremotewrite/prometheus:
        endpoint: http://prometheus-server.observability-opensearch.svc.cluster.local/api/v1/write
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        resource_to_telemetry_conversion:
          enabled: true
      
      # OpenSearch exporter for Logs
      # Sends logs to OpenSearch using observability catalog schema
      opensearch/logs:
        logs_index: ss4o_logs-otel-demo-default
        http:
          endpoint: https://opensearch-cluster.observability-opensearch.svc.cluster.local:9200
          auth:
            authenticator: basicauth/opensearch
          tls:
            ca_file: /etc/opensearch-certs/ca.crt
            insecure: false
            insecure_skip_verify: false
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # Debug exporter for debugging (optional)
      debug:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200
    
    service:
      extensions: [health_check, basicauth/opensearch]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [otlp/jaeger]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [prometheusremotewrite/prometheus]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes]
          exporters: [opensearch/logs, debug]
  
  # Collector Resources
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  
  # Collector Replicas
  replicaCount: 2
  
  # RBAC für Kubernetes Attributes Processor
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
          - namespaces
        verbs:
          - get
          - watch
          - list
      - apiGroups:
          - apps
        resources:
          - replicasets
          - deployments
        verbs:
          - get
          - list
          - watch
  
  serviceAccount:
    create: true
  
  # Mount OpenSearch CA certificate from observability-opensearch namespace
  extraVolumes:
    - name: opensearch-ca-cert
      secret:
        secretName: opensearch-cluster-http-cert
        items:
          - key: ca.crt
            path: ca.crt
  
  extraVolumeMounts:
    - name: opensearch-ca-cert
      mountPath: /etc/opensearch-certs
      readOnly: true
  
  # Ports
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

# Components Konfiguration
