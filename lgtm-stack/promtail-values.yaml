# Promtail Values for LGTM Stack
# Collects container logs and sends to Loki

# Promtail configuration
config:
  # Loki endpoint
  clients:
    - url: http://loki-gateway.observability-lgtm.svc.cluster.local/loki/api/v1/push
      tenant_id: fake

  # Scrape configuration
  snippets:
    # Scrape container logs from specific namespaces
    scrapeConfigs: |
      # Collect logs from otel-demo namespace
      - job_name: otel-demo
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - otel-demo-lgtm
        pipeline_stages:
          - cri: {}
          - labeldrop:
              - filename
          - json:
              expressions:
                level: level
                message: msg
          - labels:
              level:
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node_name
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            target_label: component
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: app
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

# Resources
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

# Service Monitor for Prometheus metrics
serviceMonitor:
  enabled: false
